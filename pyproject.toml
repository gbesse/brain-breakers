[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-breakers"
version = "0.1.0a1"
description = "Tests de mutation mémoire · Memory mutation trials · Pruebas de mutación de memoria"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
brain-breakers = "brain_breakers.__main__:main"

[tool.setuptools.packages.find]
include = ["brain_breakers*"]

[tool.setuptools.package-data]
brain_breakers = ["web/*", "examples/*"]

[project.optional-dependencies]
engines = ["chromadb==1.5.9", "qdrant-client==1.19.1"]
